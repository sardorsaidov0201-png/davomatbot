<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Davomat</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f9);
            --text-color: var(--tg-theme-text-color, #333);
            --btn-color: var(--tg-theme-button-color, #248b1d);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            width: 85%;
            max-width: 340px;
            box-sizing: border-box;
        }
        h2 { color: #248b1d; margin-top: 0; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        
        /* Raqam kiritish oynasi uslubi */
        .phone-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            margin-top: 15px;
            text-align: center;
            transition: 0.3s;
        }
        .phone-input:focus {
            border-color: #248b1d;
        }

        .btn {
            background-color: var(--btn-color);
            color: var(--btn-text);
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .hidden { display: none; }
        .icon { font-size: 50px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

<div class="card">
    <!-- 1-BOSQICH: Kirish oynasi (Kiritish maydoni bilan) -->
    <div id="auth-screen">
        <span class="icon">🔐</span>
        <h2>Tizimga kirish</h2>
        <p>Smart Davomat platformasidan foydalanish uchun telefon raqamingizni kiriting:</p>
        <input type="tel" id="phone-field" class="phone-input" placeholder="+998901234567" value="+998">
        <button class="btn" id="login-btn">🔑 Tizimga kirish</button>
    </div>

    <!-- 2-BOSQICH: Asosiy oynasi -->
    <div id="main-screen" class="hidden">
        <span class="icon">🎯</span>
        <h2>Smart Davomat</h2>
        <p>Xush kelibsiz, <strong id="user-name">Foydalanuvchi</strong>!</p>
        <p>Telefon: <span id="user-phone" style="font-weight: bold; color: #248b1d;"></span></p>
        <p>Bugungi sana: <span id="current-date"></span></p>
        <p>Mavjudligingizni tasdiqlash uchun quyidagi yashil tugmani bosing.</p>
        <button class="btn" id="checkin-btn">✅ Davomatdan o'tish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 
    tg.ready();

    let firstName = "Foydalanuvchi";
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        firstName = tg.initDataUnsafe.user.first_name;
    }
    document.getElementById('user-name').innerText = firstName;
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('uz-UZ');

    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const phoneField = document.getElementById('phone-field');
    const userPhoneSpan = document.getElementById('user-phone');

    let kiritilganRaqam = "";

    // Kirish tugmasi bosilganda
    document.getElementById('login-btn').addEventListener('click', () => {
        kiritilganRaqam = phoneField.value.trim();
        
        // Oddiy tekshiruv (Raqam uzunligi kamida 9 ta belgidan oshishi kerak)
        if (kiritilganRaqam.length < 9 || kiritilganRaqam === "+998") {
            alert("Iltimos, telefon raqamingizni to‘g‘ri kiriting!");
            return;
        }

        // Ekranlarni almashtirish
        userPhoneSpan.innerText = kiritilganRaqam;
        authScreen.classList.add('hidden');
        mainScreen.classList.remove('hidden');
    });

    // Davomatdan o'tish tugmasi bosilganda
    document.getElementById('checkin-btn').addEventListener('click', () => {
        const data = { 
            action: "check_in",
            phone: kiritilganRaqam,
            time: new Date().toLocaleTimeString('uz-UZ')
        };
        tg.sendData(JSON.stringify(data)); 
        tg.close(); 
    });
</script>
</body>
</html>
